# Render.com service definition for the TaskSphere backend.
# Deploy: push to a Git repo, then on Render click "New +" → "Blueprint"
# and point it at this file. Render will provision PostgreSQL, set the
# DATABASE_URL, and deploy the Dockerfile.
services:
  - type: web
    name: tasksphere-api
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: tasksphere-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        value: https://tasksphere-web.vercel.app
      - key: CORS_ORIGIN
        value: https://tasksphere-web.vercel.app
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: no-reply@tasksphere.app
      - key: SMTP_FROM_NAME
        value: TaskSphere
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: tasksphere
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false

databases:
  - name: tasksphere-db
    plan: starter
    region: frankfurt
    databaseName: neondb
    user: neondb_owner
